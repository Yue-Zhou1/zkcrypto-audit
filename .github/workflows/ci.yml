name: CI

on:
  pull_request:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure local Claude settings are not tracked
        run: |
          if git ls-files --error-unmatch .claude/settings.local.json >/dev/null 2>&1; then
            echo "ERROR: .claude/settings.local.json must not be tracked."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install check dependencies
        run: pip install -r scripts/requirements.txt

      - name: Check generated packaging and repository consistency
        run: python3 scripts/sync.py --check

      - name: Verify Python sources compile
        run: |
          python3 -m py_compile \
            scripts/sync.py \
            plugins/evidence-and-tooling/skills/zkbugs-index/scripts/_shared.py \
            plugins/evidence-and-tooling/skills/zkbugs-index/scripts/build_index.py \
            plugins/evidence-and-tooling/skills/zkbugs-index/scripts/contribute_bug.py
