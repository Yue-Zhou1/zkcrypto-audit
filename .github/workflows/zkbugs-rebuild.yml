name: zkbugs-index Upstream Sync

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Diff zkbugs upstream against committed index
        id: diff
        run: |
          set -euo pipefail
          python3 plugins/evidence-and-tooling/scripts/build_index.py --config plugins/evidence-and-tooling/config/zkbugs-sources.json --diff-upstream | tee zkbugs-upstream-diff.txt

          if grep -Eq "NEW entries|entries REMOVED" zkbugs-upstream-diff.txt; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
            echo "Upstream drift detected — index will be rebuilt and a PR opened."
          else
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "Index is current with upstream."
          fi

      - name: Rebuild index
        if: steps.diff.outputs.drift == 'true'
        run: |
          set -euo pipefail
          python3 plugins/evidence-and-tooling/scripts/build_index.py --config plugins/evidence-and-tooling/config/zkbugs-sources.json --rebuild --no-embeddings

      - name: Prepare PR body
        if: steps.diff.outputs.drift == 'true'
        run: |
          {
            echo "Automated weekly sync of the zkbugs index with upstream [zksecurity/zkbugs](https://github.com/zksecurity/zkbugs)."
            echo
            echo "Upstream diff that triggered this rebuild:"
            echo
            echo '```'
            cat zkbugs-upstream-diff.txt
            echo '```'
          } > zkbugs-pr-body.md

      - name: Create pull request
        if: steps.diff.outputs.drift == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: plugins/evidence-and-tooling/index/**
          commit-message: "chore: rebuild zkbugs index from upstream"
          branch: auto/zkbugs-index-sync
          delete-branch: true
          title: "chore: sync zkbugs index with upstream"
          body-path: zkbugs-pr-body.md

      - name: Upload diff artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zkbugs-upstream-diff
          path: zkbugs-upstream-diff.txt
