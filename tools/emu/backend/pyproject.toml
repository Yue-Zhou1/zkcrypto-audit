[project]
name = "emu"
version = "0.1.0"
description = "Local Evidence Management UI backend for zkcrypto-audit sessions."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "jsonschema>=4.22,<5",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "uvicorn[standard]>=0.30,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["emu*"]
