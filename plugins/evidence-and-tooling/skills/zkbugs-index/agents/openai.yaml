interface:
  display_name: zkbugs-index
  short_description: Queryable index of real-world ZK proof-system vulnerabilities. Use during
    a ZK audit to check whether a suspicious pattern has documented precedent, to cite prior
    art for a verified finding, or to record a verified, novel, circuit-level finding. Covers
    circom, halo2, cairo, gnark, arkworks, plonky3, zkVM, and other DSLs. Backed by the zksecurity/zkbugs
    corpus and an optional organization findings repo.
  default_prompt: Use zkbugs-index for this task. Queryable index of real-world ZK proof-system
    vulnerabilities. Use during a ZK audit to check whether a suspicious pattern has documented
    precedent, to cite prior art for a verified finding, or to record a verified, novel, circuit-level
    finding. Covers circom, halo2, cairo, gnark, arkworks, plonky3, zkVM, and other DSLs.
    Backed by the zksecurity/zkbugs corpus and an optional organization findings repo.
