interface:
  display_name: zkvm-auditor
  short_description: Audit zkVM guest programs and proof systems for memory consistency, continuation
    proof soundness, precompile safety, and guest-host boundary violations across SP1, RISC
    Zero, and Valida. Use when reviewing guest input handling and unconstrained hints, public-values
    commitment and program-identifier pinning, precompile or syscall constraints, segment
    and shard aggregation, mock or dev proof modes, or zkEVM execution equivalence.
  default_prompt: Use zkvm-auditor for this task. Audit zkVM guest programs and proof systems
    for memory consistency, continuation proof soundness, precompile safety, and guest-host
    boundary violations across SP1, RISC Zero, and Valida. Use when reviewing guest input
    handling and unconstrained hints, public-values commitment and program-identifier pinning,
    precompile or syscall constraints, segment and shard aggregation, mock or dev proof modes,
    or zkEVM execution equivalence.
