interface:
  display_name: onchain-verifier-auditor
  short_description: Audit Solidity, Vyper, or Huff proof-verifier contracts for pairing precompile
    misuse, missing scalar-field checks on public inputs, calldata decoding errors, and verification-key
    provenance or upgrade risks. Use when reviewing on-chain SNARK/STARK verifier contracts
    or EIP-196/197/2537 precompile call sites.
  default_prompt: Use onchain-verifier-auditor for this task. Audit Solidity, Vyper, or Huff
    proof-verifier contracts for pairing precompile misuse, missing scalar-field checks on
    public inputs, calldata decoding errors, and verification-key provenance or upgrade risks.
    Use when reviewing on-chain SNARK/STARK verifier contracts or EIP-196/197/2537 precompile
    call sites.
