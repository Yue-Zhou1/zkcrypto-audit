interface:
  display_name: fault-injection-auditor
  short_description: 'Audit cryptographic code for active fault-injection attacks: RSA-CRT
    Bellcore faults, ECDSA/EdDSA differential fault analysis, verification-skip glitches,
    redundant-computation bypass, and verify-after-sign gaps. Use when the threat model includes
    an attacker who can glitch computation, distinct from passive side-channel leakage.'
  default_prompt: 'Use fault-injection-auditor for this task. Audit cryptographic code for
