interface:
  display_name: randomness-auditor
  short_description: 'Audit randomness and nonce lifecycles: CSPRNG/DRBG initialization and
    reseeding, entropy availability, fork/clone/snapshot duplication, deterministic nonce
    derivation (RFC 6979, EdDSA), and reuse across retries, crashes, persistence, and concurrent
    state. Use when any secret-dependent random value''s generation or lifetime is in question.'
  default_prompt: 'Use randomness-auditor for this task. Audit randomness and nonce lifecycles:
    CSPRNG/DRBG initialization and reseeding, entropy availability, fork/clone/snapshot duplication,
    deterministic nonce derivation (RFC 6979, EdDSA), and reuse across retries, crashes, persistence,
    and concurrent state. Use when any secret-dependent random value''s generation or lifetime
    is in question.'
