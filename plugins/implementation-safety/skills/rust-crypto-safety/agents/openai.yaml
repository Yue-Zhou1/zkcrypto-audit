interface:
  display_name: rust-crypto-safety
  short_description: 'Review Rust cryptographic code for implementation-level security bugs:
    unsafe blocks and FFI, panics and arithmetic overflow on untrusted input, secret zeroization
    and lifetime, unchecked constructors, manual Send/Sync, numeric casts, and security-significant
    cfg/feature gating. Use when auditing Rust crates that implement or wrap cryptography,
    including zkVM guest binaries.'
  default_prompt: 'Use rust-crypto-safety for this task. Review Rust cryptographic code for
    implementation-level security bugs: unsafe blocks and FFI, panics and arithmetic overflow
    on untrusted input, secret zeroization and lifetime, unchecked constructors, manual Send/Sync,
    numeric casts, and security-significant cfg/feature gating. Use when auditing Rust crates
    that implement or wrap cryptography, including zkVM guest binaries.'
