interface:
  display_name: signature-scheme-auditor
  short_description: Audit classical signature schemes — generic ECDSA across curves, Schnorr/
    BIP-340, EdDSA/Ed25519, RSA-PSS and PKCS#1 v1.5 — for verification-equation correctness,
    malleability, canonical encoding, public-key validation, and hash/prehash semantics. Use
    for standalone signature library review outside Ethereum application encoding, BLS, or
    threshold protocols.
  default_prompt: Use signature-scheme-auditor for this task. Audit classical signature schemes
    — generic ECDSA across curves, Schnorr/ BIP-340, EdDSA/Ed25519, RSA-PSS and PKCS#1 v1.5
    — for verification-equation correctness, malleability, canonical encoding, public-key
    validation, and hash/prehash semantics. Use for standalone signature library review outside
    Ethereum application encoding, BLS, or threshold protocols.
