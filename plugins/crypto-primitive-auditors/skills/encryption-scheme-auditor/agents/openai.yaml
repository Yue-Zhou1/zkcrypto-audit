interface:
  display_name: encryption-scheme-auditor
  short_description: Audit symmetric and hybrid encryption for AEAD nonce handling and usage
    limits, key commitment, associated-data binding, decrypt and padding oracle behavior,
    key-derivation and key-separation misuse, HPKE/ECIES composition, streaming AEAD truncation
    or reordering, and decrypt-error side effects. Use when reviewing encrypt/decrypt paths,
    envelope or file encryption, key wrapping, or hybrid public-key encryption.
  default_prompt: Use encryption-scheme-auditor for this task. Audit symmetric and hybrid
    encryption for AEAD nonce handling and usage limits, key commitment, associated-data binding,
    decrypt and padding oracle behavior, key-derivation and key-separation misuse, HPKE/ECIES
    composition, streaming AEAD truncation or reordering, and decrypt-error side effects.
    Use when reviewing encrypt/decrypt paths, envelope or file encryption, key wrapping, or
    hybrid public-key encryption.
