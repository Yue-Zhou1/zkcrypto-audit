interface:
  display_name: pqc-signature-auditor
  short_description: Audit post-quantum signature implementations — ML-DSA (FIPS 204), SLH-DSA
    (FIPS 205), FN-DSA/Falcon (pending standardization), and stateful hash signatures XMSS/LMS/HSS
    (NIST SP 800-208) — for rejection-sampling correctness, hedged/deterministic signing modes,
    verification bound enforcement, and one-time-signature state management. Use when reviewing
    PQ signing, verification, or OTS index/state persistence.
  default_prompt: Use pqc-signature-auditor for this task. Audit post-quantum signature implementations
    — ML-DSA (FIPS 204), SLH-DSA (FIPS 205), FN-DSA/Falcon (pending standardization), and
    stateful hash signatures XMSS/LMS/HSS (NIST SP 800-208) — for rejection-sampling correctness,
    hedged/deterministic signing modes, verification bound enforcement, and one-time-signature
    state management. Use when reviewing PQ signing, verification, or OTS index/state persistence.
