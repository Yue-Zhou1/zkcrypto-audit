interface:
  display_name: fhe-auditor
  short_description: Audit fully homomorphic encryption code (BFV, BGV, CKKS, TFHE) for noise-budget
    accounting, modulus and key switching, relinearization, bootstrapping correctness, parameter
    security, decryption-result exposure (IND-CPA-D), circuit privacy, threshold decryption
    shares, evaluation-key provenance, and validation of untrusted ciphertexts. Use when reviewing
    an FHE library, a service that evaluates on encrypted data, or any path that decrypts
    or releases homomorphic results.
  default_prompt: Use fhe-auditor for this task. Audit fully homomorphic encryption code (BFV,
    BGV, CKKS, TFHE) for noise-budget accounting, modulus and key switching, relinearization,
    bootstrapping correctness, parameter security, decryption-result exposure (IND-CPA-D),
    circuit privacy, threshold decryption shares, evaluation-key provenance, and validation
    of untrusted ciphertexts. Use when reviewing an FHE library, a service that evaluates
    on encrypted data, or any path that decrypts or releases homomorphic results.
