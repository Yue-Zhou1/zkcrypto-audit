interface:
  display_name: pqc-kem-auditor
  short_description: Audit standardized post-quantum KEM implementations — currently ML-KEM
    / FIPS 203 — for encapsulation/decapsulation conformance, implicit-rejection correctness,
    ciphertext and key validation, compression/rounding, and decapsulation-failure oracle
    resistance. Use when reviewing ML-KEM/Kyber APIs, serialization, or decapsulation paths.
  default_prompt: Use pqc-kem-auditor for this task. Audit standardized post-quantum KEM implementations
    — currently ML-KEM / FIPS 203 — for encapsulation/decapsulation conformance, implicit-rejection
    correctness, ciphertext and key validation, compression/rounding, and decapsulation-failure
    oracle resistance. Use when reviewing ML-KEM/Kyber APIs, serialization, or decapsulation
    paths.
