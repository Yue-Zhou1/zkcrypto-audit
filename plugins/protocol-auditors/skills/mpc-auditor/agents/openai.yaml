interface:
  display_name: mpc-auditor
  short_description: 'Audit multi-party computation implementations: garbled circuits (free-XOR,
    half-gates, selective failure), oblivious transfer and OT extension, SPDZ-style MAC checks,
    Beaver triple authenticity, share validation, malicious vs semi-honest claims, abort and
    fairness handling, and transcript/session binding. Use when reviewing 2PC/MPC protocol
    code, preprocessing pipelines, or multi-round secure-computation handlers.'
