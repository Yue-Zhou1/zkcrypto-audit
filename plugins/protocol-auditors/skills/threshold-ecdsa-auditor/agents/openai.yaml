interface:
  display_name: threshold-ecdsa-auditor
  short_description: Audit threshold ECDSA implementations (GG18, GG20, CGGMP21, Lindell-style)
    for Paillier modulus validity, MtA/MtAwc range-proof gaps, share-conversion soundness,
    resharing and concurrent-session isolation, and identifiable-abort leakage. Use when reviewing
    multi-party ECDSA keygen, signing, or resharing.
  default_prompt: Use threshold-ecdsa-auditor for this task. Audit threshold ECDSA implementations
    (GG18, GG20, CGGMP21, Lindell-style) for Paillier modulus validity, MtA/MtAwc range-proof
    gaps, share-conversion soundness, resharing and concurrent-session isolation, and identifiable-abort
    leakage. Use when reviewing multi-party ECDSA keygen, signing, or resharing.
