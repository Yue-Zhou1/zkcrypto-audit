interface:
  display_name: vrf-auditor
  short_description: Audit Verifiable Random Function implementations (RFC 9381 ECVRF and
    RSA-FDH-VRF) for key validation, ciphersuite/suite-string domain separation, encode-to-curve
    and cofactor handling, proof-to-hash ordering, and uniqueness/pseudorandomness assumptions,
    plus application-level output grinding. Use when reviewing VRF provers, verifiers, or
    consumers of VRF outputs (leader election, lotteries, randomness beacons).
  default_prompt: Use vrf-auditor for this task. Audit Verifiable Random Function implementations
    (RFC 9381 ECVRF and RSA-FDH-VRF) for key validation, ciphersuite/suite-string domain separation,
    encode-to-curve and cofactor handling, proof-to-hash ordering, and uniqueness/pseudorandomness
    assumptions, plus application-level output grinding. Use when reviewing VRF provers, verifiers,
    or consumers of VRF outputs (leader election, lotteries, randomness beacons).
